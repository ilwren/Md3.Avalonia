name: CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify embedded official fonts
        run: |
          mkdir -p src/Md3.Avalonia.Icons/Assets/Fonts
          python3 scripts/verify-fonts.py

      - name: Build Gallery Desktop
        shell: bash
        run: |
          set +e
          set -o pipefail
          dotnet build gallery/Md3.Avalonia.Gallery.Desktop/Md3.Avalonia.Gallery.Desktop.csproj -c Release 2>&1 | tee gallery-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E 'error (CS|AVLN|MSB)[0-9]+|: error :' gallery-build.log | head -50 | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              echo "::error title=.NET build failed::$line"
            done
          fi
          exit "$status"

      - name: Run Headless Tests
        run: dotnet test tests/Md3.Avalonia.HeadlessTests/Md3.Avalonia.HeadlessTests.csproj -c Release --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"

      - name: Summarize Headless Test Results
        if: always()
        run: python3 scripts/report-test-results.py

      - name: Upload Headless Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-test-results
          path: '**/results.trx'
          if-no-files-found: warn

      - name: Verify NuGet Packaging
        run: bash scripts/build-nuget.sh
