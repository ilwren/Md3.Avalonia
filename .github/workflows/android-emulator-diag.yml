# TEMPORARY: emulator availability probe.
#
# Established so far, from annotations (job logs and artifacts are unreachable from the agent's
# sandbox — blob storage is not allowed there):
#   * macos-15 is an "Apple M1 (Virtual)" VM without nested virtualization, so the emulator dies
#     with "HVF error: HV_UNSUPPORTED" before Android boots. No arch or option fixes that.
#   * A hand-rolled AVD on ubuntu-latest never produced a bootable AVD.
# This run asks the question the standard way: the emulator action on ubuntu-latest (KVM), with
# the default graphics options and a long boot timeout. If Android boots, the collector runs for
# real and its annotations become the end-to-end evidence. DELETE AFTER USE.
name: Android Emulator Diagnostics (TEMPORARY)

on:
  pull_request:
    paths:
      - '.github/workflows/android-emulator-diag.yml'

jobs:
  probe:
    name: Emulator probe on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK & Workloads
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Build Android Gallery APK
        run: |
          dotnet publish gallery/Md3.Avalonia.Gallery.Android/Md3.Avalonia.Gallery.Android.csproj \
            -c Release \
            -f net10.0-android \
            -p:AndroidPackageFormat=apk \
            -o artifacts/android/

      - name: Boot emulator with the standard action and collect
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            # The emulator does boot here (a boot timeout would abort before this script), so the
            # failure is inside these commands. Annotate each one: job logs are unreadable from
            # the agent sandbox, annotations are not.
            echo "::notice::diag::devices=$(adb devices -l | tr '\n' ' ')"
            find artifacts/android -name '*.apk' 2>/dev/null | while read -r f; do
              echo "::notice::diag::apk $f $(wc -c < "$f") bytes"
            done
            apk=$(find artifacts/android -name '*.apk' 2>/dev/null | head -1)
            if [ -n "$apk" ]; then
              adb install "$apk" || echo "::warning::diag::adb install failed"
            else
              echo "::warning::diag::no apk under artifacts/android"
            fi
            adb shell monkey -p io.arena.md3avalonia.gallery -c android.intent.category.LAUNCHER 1 \
              || echo "::warning::diag::monkey launch failed"
            sleep 20
            mkdir -p artifacts/android-test
            python3 scripts/collect-android-perf.py \
              --package io.arena.md3avalonia.gallery \
              --apk artifacts/android \
              --output-dir artifacts/android-test \
              --summary --github || echo "::warning::diag::collector exited non-zero"
            echo "::notice::diag::evidence=$(ls artifacts/android-test | tr '\n' ' ')"

      - name: Verify what the collector wrote
        if: always()
        run: |
          python3 - <<'EOF'
          import json, pathlib
          p = pathlib.Path("artifacts/android-test/android-perf.json")
          if not p.is_file():
              print("::error::diag::no android-perf.json: the emulator never booted")
          else:
              d = json.loads(p.read_text())
              print("::notice::diag::json=" + json.dumps(
                  {"device": d["device"], "apkBytes": d["apkBytes"],
                   "gfx": d["gfx"], "mem": d["mem"], "startup": d["startup"],
                   "warnings": d["warnings"]})[:3500])
              for f in sorted(pathlib.Path("artifacts/android-test").iterdir()):
                  print(f"::warning::diag::file {f.name} {f.stat().st_size}B")
          EOF

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-probe
          path: artifacts/android-test/
          if-no-files-found: warn
