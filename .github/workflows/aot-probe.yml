name: AOT probe

on:
  workflow_dispatch:
  push:
    branches: [arena/01a104af-md3-avalonia]
    paths: ['.github/workflows/aot-probe.yml']

jobs:
  publish-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install the native toolchain ILC links against
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish the desktop gallery with native AOT
        run: |
          dotnet publish gallery/Md3.Avalonia.Gallery.Desktop/Md3.Avalonia.Gallery.Desktop.csproj \
            -c Release -r linux-x64 \
            -p:PublishAot=true \
            -p:TreatWarningsAsErrors=false \
            -o /tmp/aot-out 2>&1 | tee /tmp/aot.log
      - name: Summarise
        if: always()
        run: |
          echo "### Trim and AOT diagnostics" >> $GITHUB_STEP_SUMMARY
          grep -oE 'IL[0-9]{4}' /tmp/aot.log | sort | uniq -c | sort -rn | head -20 >> $GITHUB_STEP_SUMMARY || echo "none" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Binary" >> $GITHUB_STEP_SUMMARY
          ls -la /tmp/aot-out 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY || true
