name: Build NuGet Packages

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  pack:
    name: Build & Pack NuGet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Verify embedded official fonts
        run: |
          mkdir -p src/Md3.Avalonia.Icons/Assets/Fonts
          python3 scripts/verify-fonts.py

      - name: Build and Pack NuGet Packages
        shell: bash
        run: |
          mkdir -p artifacts/nuget
          status=0
          bash scripts/build-nuget.sh --output artifacts/nuget > /tmp/pack.log 2>&1 || status=$?
          cat /tmp/pack.log
          {
            echo "### Pack diagnostics (exit $status)"
            if grep -qE 'error|NU[0-9]{4}|NETSDK[0-9]{4}|MSB[0-9]{4}' /tmp/pack.log; then
              grep -E 'error|NU[0-9]{4}|NETSDK[0-9]{4}|MSB[0-9]{4}' /tmp/pack.log \
                | sed 's/^/    /' | sort -u | head -60
            else
              echo "    no error line matched; last 40 lines:"
              tail -40 /tmp/pack.log | sed 's/^/    /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload NuGet Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget/*
          if-no-files-found: error
