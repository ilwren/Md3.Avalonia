name: Publish Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release channel
        type: choice
        required: true
        default: preview
        options:
          - preview
          - stable
      version:
        description: Base semantic version, without a preview suffix (for example 0.4.6)
        type: string
        required: true
        default: '0.4.6'
      preview_number:
        description: Preview sequence; used only for preview releases (for example 1)
        type: string
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      release_type: ${{ steps.resolve.outputs.release_type }}
      android_version_code: ${{ steps.resolve.outputs.android_version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and validate version
        id: resolve
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          BASE_VERSION: ${{ inputs.version }}
          PREVIEW_NUMBER: ${{ inputs.preview_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from the main branch." >&2
            exit 1
          fi
          if [[ ! "$BASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be a stable base such as 0.4.6 (do not include a prerelease suffix)." >&2
            exit 1
          fi

          case "$RELEASE_TYPE" in
            preview)
              if [[ ! "$PREVIEW_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
                echo "Preview number must be a positive integer." >&2
                exit 1
              fi
              VERSION="${BASE_VERSION}-preview.${PREVIEW_NUMBER}"
              ;;
            stable)
              VERSION="$BASE_VERSION"
              ;;
            *)
              echo "Unknown release channel: $RELEASE_TYPE" >&2
              exit 1
              ;;
          esac

          TAG="v${VERSION}"
          remote_tag="$(git ls-remote --tags origin "refs/tags/${TAG}")"
          if [[ -n "$remote_tag" ]]; then
            echo "Tag ${TAG} already exists; choose a new version." >&2
            exit 1
          fi

          # The Android version code must increase for each workflow run; the repository's
          # currently checked-in code is 6, so offset the per-workflow run number by 6.
          ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 6))
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_type=${RELEASE_TYPE}" >> "$GITHUB_OUTPUT"
          echo "android_version_code=${ANDROID_VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${RELEASE_TYPE} version ${VERSION} (${TAG})."

  test:
    name: Headless tests
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run headless tests
        run: |
          dotnet test tests/Md3.Avalonia.HeadlessTests/Md3.Avalonia.HeadlessTests.csproj \
            -c Release \
            --logger "console;verbosity=normal"

  pack-nuget:
    name: Pack the NuGet packages
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Pack with release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/build-nuget.sh --output artifacts/nuget --version "$RELEASE_VERSION"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: release-nuget
          path: artifacts/nuget/*
          if-no-files-found: error
          retention-days: 7

  gallery-desktop:
    name: Publish desktop Gallery (${{ matrix.rid }})
    needs: [prepare, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify embedded official fonts
        shell: bash
        run: |
          mkdir -p src/Md3.Avalonia.Icons/Assets/Fonts
          python3 scripts/verify-fonts.py || python scripts/verify-fonts.py

      - name: Publish self-contained desktop Gallery
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          dotnet publish gallery/Md3.Avalonia.Gallery.Desktop/Md3.Avalonia.Gallery.Desktop.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:Version="$RELEASE_VERSION" \
            -o "artifacts/desktop-${{ matrix.rid }}"

      - name: Archive Unix desktop Gallery
        if: matrix.rid != 'win-x64'
        shell: bash
        run: |
          (cd "artifacts/desktop-${{ matrix.rid }}" && \
            zip -qr "$GITHUB_WORKSPACE/artifacts/gallery-${{ matrix.rid }}.zip" .)

      - name: Archive Windows desktop Gallery
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "artifacts/desktop-win-x64/*" `
            -DestinationPath "artifacts/gallery-win-x64.zip" `
            -Force

      - name: Upload desktop Gallery archive
        uses: actions/upload-artifact@v4
        with:
          name: gallery-desktop-${{ matrix.rid }}
          path: artifacts/gallery-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 7

  gallery-android:
    name: Publish Android Gallery
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Verify embedded official fonts
        run: |
          mkdir -p src/Md3.Avalonia.Icons/Assets/Fonts
          python3 scripts/verify-fonts.py

      - name: Publish versioned Gallery APK
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.android_version_code }}
        run: |
          dotnet publish gallery/Md3.Avalonia.Gallery.Android/Md3.Avalonia.Gallery.Android.csproj \
            -c Release \
            -f net10.0-android \
            -p:Version="$RELEASE_VERSION" \
            -p:ApplicationDisplayVersion="$RELEASE_VERSION" \
            -p:ApplicationVersion="$ANDROID_VERSION_CODE" \
            -p:AndroidPackageFormat=apk \
            -o artifacts/android

      - name: Upload Android Gallery
        uses: actions/upload-artifact@v4
        with:
          name: gallery-android
          path: artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish NuGet packages and create GitHub Release
    needs: [prepare, test, pack-nuget, gallery-desktop, gallery-android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Trusted publishing: this job exchanges the Actions OIDC token for a short-lived nuget.org
      # API key, so no long-lived key is stored in the repository. Only this job gets the
      # permission; the build and test jobs never talk to nuget.org.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Package Gallery assets and checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-bundle
          for rid in linux-x64 win-x64 osx-x64; do
            archive="release-artifacts/gallery-desktop-${rid}/gallery-${rid}.zip"
            test -f "$archive"
            cp "$archive" release-bundle/
          done
          find release-artifacts/gallery-android -maxdepth 1 -type f -name '*.apk' -exec cp {} release-bundle/ \;
          test -n "$(find release-bundle -maxdepth 1 -type f -name '*.apk' -print -quit)"
          cp release-artifacts/release-nuget/* release-bundle/
          (cd release-bundle && sha256sum * > SHA256SUMS.txt)
          echo "Prepared release bundle for ${RELEASE_VERSION}:"
          ls -lh release-bundle

      - name: Publish packages to NuGet.org
        env:
          # The nuget.org account that owns the packages. A repository variable rather than a
          # secret, because the name is not sensitive: the Trusted Publishing policy is what
          # actually authorises the push.
          NUGET_USERNAME: ${{ vars.NUGET_USERNAME }}
        run: |
          set -euo pipefail

          # Take the expected count from the one list that already drives the pack step, so adding
          # a package cannot leave this check behind the way a hardcoded "exactly seven" did.
          expected="$(sed -n 's/^PACKAGE_IDS=(\(.*\))$/\1/p' scripts/build-nuget.sh | wc -w)"
          if (( expected == 0 )); then
            echo "Could not read PACKAGE_IDS out of scripts/build-nuget.sh." >&2
            exit 1
          fi

          shopt -s nullglob
          packages=(release-artifacts/release-nuget/*.nupkg)
          if (( ${#packages[@]} != expected )); then
            echo "Expected ${expected} .nupkg files, found ${#packages[@]}." >&2
            exit 1
          fi

          if [[ -z "${NUGET_USERNAME:-}" ]]; then
            echo "Repository variable NUGET_USERNAME must name the nuget.org account that owns the packages." >&2
            exit 1
          fi

          # Trusted publishing: the Actions OIDC token is exchanged for an API key that nuget.org
          # expires after about twenty minutes. That is why the exchange happens here and not at
          # the top of the job - the test, pack and Gallery builds before this step take far
          # longer than the key lives.
          #
          # The audience must be "nuget.org". nuget.org then matches the token's repository,
          # repository_owner, job_workflow_ref and environment claims against the Trusted
          # Publishing policy. The token endpoint also requires a User-Agent header.
          oidc_response="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=nuget.org")"
          if ! oidc_token="$(printf '%s' "${oidc_response}" | jq -er '.value' 2>/dev/null)"; then
            echo "The Actions OIDC request returned no token. This job needs the id-token: write permission." >&2
            exit 1
          fi

          token_response="$(curl -sS -X POST 'https://www.nuget.org/api/v2/token' \
            -H "Authorization: Bearer ${oidc_token}" \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: md3-avalonia-publish-release' \
            --data "{\"username\":\"${NUGET_USERNAME}\",\"tokenType\":\"ApiKey\"}")"
          if ! api_key="$(printf '%s' "${token_response}" | jq -er '.apiKey' 2>/dev/null)"; then
            echo "nuget.org did not return an API key. Check the Trusted Publishing policy: it has to name this repository owner, this repository, this workflow file, and an environment that matches this job." >&2
            printf '%s\n' "${token_response}" >&2
            exit 1
          fi
          # Masked before the key can reach a log line.
          printf '::add-mask::%s\n' "${api_key}"

          # One key covers every package the policy's glob allows, so all packages go up with the
          # same short-lived key. Each .nupkg carries the .snupkg sitting beside it.
          for package in "${packages[@]}"; do
            dotnet nuget push "${package}" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${api_key}" \
              --skip-duplicate
          done
          echo "Pushed ${#packages[@]} packages to nuget.org."

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_TYPE: ${{ needs.prepare.outputs.release_type }}
        run: |
          set -euo pipefail
          release_args=(
            "$RELEASE_TAG"
            --title "Md3.Avalonia ${RELEASE_VERSION}"
            --target "$GITHUB_SHA"
            --generate-notes
          )
          if [[ "$RELEASE_TYPE" == "preview" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}" release-bundle/*
