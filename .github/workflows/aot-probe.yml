name: AOT probe

on:
  workflow_dispatch:
  push:
    # The probe is the only place the desktop gallery is actually compiled to native code, so it
    # follows the two inputs that can break that: the gallery itself and the library it consumes.
    branches: [main, 'arena/**']
    paths:
      - '.github/workflows/aot-probe.yml'
      - 'gallery/**'
      - 'src/**'
      - 'src/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'

jobs:
  publish-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install the native toolchain ILC links against
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      # TreatWarningsAsErrors stays off until the publish is clean: one run then reports both the
      # IL diagnostics and whether the produced binary still survives startup, and a build that
      # dies at the first analyzer warning would hide the second answer. This flag is the last
      # thing to remove, not the first.
      - name: Publish the desktop gallery with native AOT
        run: |
          # Without pipefail the `tee` would swallow a failing publish: the pipeline's exit status
          # is tee's, and a build error would only surface two steps later as a missing binary.
          set -o pipefail
          dotnet publish gallery/Md3.Avalonia.Gallery.Desktop/Md3.Avalonia.Gallery.Desktop.csproj \
            -c Release -r linux-x64 \
            -p:PublishAot=true \
            -p:TreatWarningsAsErrors=false \
            -o /tmp/aot-out 2>&1 | tee /tmp/aot.log
      - name: Prove the output is actually native
        run: |
          BIN=/tmp/aot-out/Md3.Avalonia.Gallery.Desktop
          echo "### AOT publish output" >> $GITHUB_STEP_SUMMARY
          ls -la /tmp/aot-out | head -20 | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          test -f "$BIN" || { echo "no native binary was produced"; exit 1; }
          DESC=$(file -b "$BIN")
          echo "    $DESC" >> $GITHUB_STEP_SUMMARY
          echo "    size: $(stat -c%s "$BIN") bytes" >> $GITHUB_STEP_SUMMARY
          case "$DESC" in
            *ELF*executable*) echo "native binary confirmed" ;;
            *) echo "not a native binary: $DESC"; exit 1 ;;
          esac
          # A native-AOT publish does not ship the app as a managed assembly.
          if [ -f /tmp/aot-out/Md3.Avalonia.Gallery.Desktop.dll ]; then
            echo "managed assembly still present - this was not an AOT publish"; exit 1
          fi
      - name: Start the native binary and see if it survives
        run: |
          sudo apt-get install -y xvfb libx11-6 libice6 libsm6 libfontconfig1 >/dev/null
          set +e
          xvfb-run -a timeout 25 /tmp/aot-out/Md3.Avalonia.Gallery.Desktop > /tmp/run.log 2>&1
          CODE=$?
          set -e
          echo "### Runtime smoke" >> $GITHUB_STEP_SUMMARY
          echo "    exit code $CODE (124 = still running when the timeout fired, which is a pass)" >> $GITHUB_STEP_SUMMARY
          tail -20 /tmp/run.log | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY
          # ILC compiling the app says nothing about reflection that is missing at runtime,
          # which is how AOT normally fails. A window that is still up after 25 seconds has
          # loaded the themes, the XAML and the icon font.
          if [ "$CODE" != "124" ]; then
            echo "the AOT binary exited on its own with $CODE:"; cat /tmp/run.log; exit 1
          fi
      # The README claims a native-AOT publish with zero IL diagnostics, so the count is asserted
      # here instead of being left as a number in a log nobody opens. Every ILxxxx diagnostic is a
      # code path that exists only at run time on some input the probe did not happen to take.
      #
      # The diagnostics are re-emitted as workflow annotations, not just printed: a warning that
      # names a file and a line lands on the run page and in the API, so the person fixing it can
      # see which call site is meant without downloading the publish log.
      - name: Count trim and AOT diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, re, sys

          summary = os.environ.get("GITHUB_STEP_SUMMARY")

          def report(text):
              print(text)
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write(text + "\n")

          report("### Diagnostics")
          log_path = pathlib.Path("/tmp/aot.log")
          if not log_path.exists():
              report("    no publish log; the build failed before the compiler ran")
              sys.exit(0)

          log = log_path.read_text(encoding="utf-8", errors="ignore")
          # MSBuild attributes a diagnostic to a call site when it can ("file(line,col): warning
          # IL2026: message"); ILC reports some of its own with the code alone. Both count, and a
          # bare line that is the body of an attributed one must not be counted twice.
          attributed = re.compile(
              r"^\s*(?P<file>[^()\n]+?)\((?P<line>\d+),(?P<col>\d+)\):\s*(?P<level>warning|error)\s+"
              r"(?P<code>IL\d{4}):\s*(?P<message>[^\n]*)", re.M)
          bare = re.compile(r"^\s*(?P<level>warning|error)\s+(?P<code>IL\d{4}):\s*(?P<message>[^\n]*)", re.M)

          entries = [
              {"code": hit.group("code"), "file": hit.group("file").strip(), "line": hit.group("line"),
               "col": hit.group("col"), "message": hit.group("message").strip()}
              for hit in attributed.finditer(log)
          ]
          spans = [hit.span() for hit in attributed.finditer(log)]
          entries += [
              {"code": hit.group("code"), "file": None, "line": None, "col": None,
               "message": hit.group("message").strip()}
              for hit in bare.finditer(log)
              if not any(start <= hit.start() < end for start, end in spans)
          ]

          if not entries:
              report("    none")
              sys.exit(0)

          report(f"    {len(entries)} diagnostic line(s), the count has to be zero")
          counts = {}
          for entry in entries:
              counts[entry["code"]] = counts.get(entry["code"], 0) + 1
          for code, count in sorted(counts.items(), key=lambda item: (-item[1], item[0])):
              report(f"    {code}: {count}")

          # An annotation has to name a repository-relative path, and MSBuild prints absolute ones.
          workspace = os.environ.get("GITHUB_WORKSPACE", "").rstrip("/")

          def relative(path):
              if workspace and path.startswith(workspace + "/"):
                  return path[len(workspace) + 1:]
              return path

          # One annotation per code and file, so the API and the run page both name the call sites.
          seen, emitted = set(), 0
          for entry in entries:
              key = (entry["code"], entry["file"])
              if key in seen:
                  continue
              seen.add(key)
              message = entry["message"][:300]
              if entry["file"]:
                  file = relative(entry["file"])
                  report(f"    {file}({entry['line']}): {entry['code']}: {message}")
                  print(f"::warning file={file},line={entry['line']},col={entry['col']}::"
                        f"{entry['code']}: {message}")
              else:
                  report(f"    {entry['code']}: {message}")
                  print(f"::warning::{entry['code']}: {message}")
              emitted += 1
              if emitted >= 10:
                  break

          sys.exit(1)
          PY
