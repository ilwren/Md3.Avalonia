name: Android UI Regression Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'gallery/**'
      - 'tests/maestro/**'
      - '.github/workflows/android-test.yml'

jobs:
  maestro-android-test:
    name: Run Android UI Regressions on Emulator
    # Not macOS: hosted macOS runners are themselves VMs ("Apple M1 (Virtual)") without nested
    # virtualization, so Hypervisor.framework refuses to start the emulator
    # ("HVF error: HV_UNSUPPORTED") and Android never boots there -- on either architecture.
    # Ubuntu runners expose /dev/kvm, which is what the emulator needs.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK & Workloads
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify embedded official fonts
        shell: bash
        run: |
          mkdir -p src/Md3.Avalonia.Icons/Assets/Fonts
          python3 scripts/verify-fonts.py

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Build Android Gallery APK
        run: |
          dotnet publish gallery/Md3.Avalonia.Gallery.Android/Md3.Avalonia.Gallery.Android.csproj \
            -c Release \
            -f net10.0-android \
            -p:AndroidPackageFormat=apk \
            -o artifacts/android/

      - name: Run Maestro Tests on Android Emulator (API 34)
        # Emulator startup is infrastructure-dependent on hosted macOS runners. Keep the
        # regression evidence available without blocking the package and desktop release checks.
        #
        # Five minutes was not enough for boot + Maestro + collection on this image: every run
        # hit the step timeout inside Maestro and uploaded nothing. Eighteen minutes leaves the
        # reported emulator boot (3-5 min) plus a bounded Maestro run plus collection.
        continue-on-error: true
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # Boots have been observed anywhere between a couple of minutes and "never" on shared
          # runners; give the emulator its own generous budget instead of racing the step timeout.
          emulator-boot-timeout: 900
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            # Install the APK and retain logcat even when a regression flow fails.
            adb install artifacts/android/*.apk
            adb logcat -c
            trap 'mkdir -p artifacts/android-test; adb logcat -d > artifacts/android-test/logcat.txt || true' EXIT

            curl -Ls "https://get.maestro.mobile.dev" | bash
            export PATH="$PATH:$HOME/.maestro/bin"

            # These are product UI regressions, not a Material/Flutter certification.
            mkdir -p artifacts/android-test
            # Bound Maestro: a flow that hangs used to consume the whole step, and then the
            # collector below never ran, so a timeout produced no performance evidence at all.
            maestro test --format junit --output artifacts/android-test/maestro-results.xml tests/maestro/ &
            maestro_pid=$!
            ( sleep 420; kill -9 "$maestro_pid" 2>/dev/null ) &
            watchdog_pid=$!
            wait "$maestro_pid" || echo "maestro exited non-zero (see maestro-results.xml)"
            kill "$watchdog_pid" 2>/dev/null || true

            # Performance evidence (frames, memory, cold start, APK size). Advisory only: the
            # helper records each command, never aborts, and the collector exits 0 with nulls on
            # any failure. Must run inside this block: the emulator only exists for this step.
            bash scripts/ci-android-perf.sh io.arena.md3avalonia.gallery artifacts/android artifacts/android-test || true

            # Merge real Headless and Android execution into the non-certifying evidence schema.
            python3 scripts/run-spec-verification.py \
              --android-junit artifacts/android-test/maestro-results.xml
            cp docs/reports/test-spec-execution-results.json artifacts/android-test/verification-results.json

      - name: Upload Android Regression Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-regression-evidence
          path: |
            ~/.maestro/tests/screenshots/
            artifacts/android-test/logcat.txt
            artifacts/android-test/maestro-results.xml
            artifacts/android-test/verification-results.json
            artifacts/android-test/android-perf.json
            artifacts/android-test/android-perf.md
            artifacts/android-test/gfxinfo.txt
            artifacts/android-test/framestats.txt
            artifacts/android-test/meminfo.txt
            artifacts/android-test/displayed.txt
            artifacts/android-test/collector-run.log
            artifacts/verification/dotnet-test.log
          if-no-files-found: warn
