name: Build Multi-Platform Gallery

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  release:
    types: [published, created]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop Gallery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generate or download fonts
        shell: bash
        run: |
          mkdir -p src/Md3.Avalonia.Icons/Assets/Fonts
          python3 scripts/generate-fonts.py || python scripts/generate-fonts.py

      - name: Publish Desktop Gallery (${{ matrix.rid }})
        shell: bash
        run: |
          dotnet publish gallery/Md3.Avalonia.Gallery.Desktop/Md3.Avalonia.Gallery.Desktop.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained false \
            -o artifacts/desktop-${{ matrix.rid }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gallery-desktop-${{ matrix.rid }}
          path: artifacts/desktop-${{ matrix.rid }}/

  build-android:
    name: Build Android Gallery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK & Android Workload
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generate or download fonts
        shell: bash
        run: |
          mkdir -p src/Md3.Avalonia.Icons/Assets/Fonts
          python3 scripts/generate-fonts.py

      - name: Install Android Workload
        run: |
          dotnet workload install android || true

      - name: Build Android Gallery APK
        run: |
          dotnet publish gallery/Md3.Avalonia.Gallery.Android/Md3.Avalonia.Gallery.Android.csproj \
            -c Release \
            -f net10.0-android \
            -p:AndroidPackageFormat=apk \
            -o artifacts/android/ || dotnet build gallery/Md3.Avalonia.Gallery.Android/Md3.Avalonia.Gallery.Android.csproj -c Release -o artifacts/android/ || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gallery-android
          path: artifacts/android/
          if-no-files-found: warn

  publish-release-assets:
    name: Publish Gallery to GitHub Release
    needs: [build-desktop, build-android]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Package and Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            mkdir -p release-bundle
            for dir in release-artifacts/gallery-desktop-*; do
              if [ -d "$dir" ]; then
                target_name=$(basename "$dir")
                (cd "$dir" && zip -r "../../release-bundle/${target_name}.zip" .)
              fi
            done
            find release-artifacts/gallery-android -name "*.apk" -exec cp {} release-bundle/ \; || true
            gh release upload "$TAG_NAME" release-bundle/* --clobber || true
          fi
