name: CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Download Material Symbols Rounded Font
        run: |
          mkdir -p src/Md3.Avalonia.Icons/Assets/Fonts
          FONT_URL="https://github.com/google/material-design-icons/raw/master/variablefont/MaterialSymbolsRounded%5BFILL%2CGRAD%2Copsz%2Cwght%5D.ttf"
          curl -sSL "$FONT_URL" -o src/Md3.Avalonia.Icons/Assets/Fonts/MaterialSymbolsRounded.ttf
          ls -lh src/Md3.Avalonia.Icons/Assets/Fonts/MaterialSymbolsRounded.ttf

      - name: Restore dependencies
        run: dotnet restore Md3.Avalonia.sln

      - name: Build solution (Release)
        run: dotnet build Md3.Avalonia.sln -c Release --no-restore

      - name: Run Headless Tests
        run: |
          set -o pipefail
          dotnet test tests/Md3.Avalonia.HeadlessTests/Md3.Avalonia.HeadlessTests.csproj -c Release --no-build --logger "console;verbosity=detailed" | tee test.log || {
            grep -E -C 2 "(Failed|Error|Exception|Assert)" test.log | head -n 40 | while IFS= read -r line; do
              echo "::error title=TestFailure::$line"
            done
            exit 1
          }

      - name: Verify NuGet Packaging
        run: bash scripts/build-nuget.sh --font src/Md3.Avalonia.Icons/Assets/Fonts/MaterialSymbolsRounded.ttf
