name: Build Multi-Platform Gallery

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop Gallery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify embedded official fonts
        shell: bash
        run: |
          mkdir -p src/Md3.Avalonia.Icons/Assets/Fonts
          python3 scripts/verify-fonts.py || python scripts/verify-fonts.py

      - name: Publish Desktop Gallery (${{ matrix.rid }})
        shell: bash
        run: |
          status=0
          dotnet publish gallery/Md3.Avalonia.Gallery.Desktop/Md3.Avalonia.Gallery.Desktop.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained false \
            -p:DebugSymbols=false \
            -p:DebugType=None \
            -o artifacts/desktop-${{ matrix.rid }} > /tmp/publish.log 2>&1 || status=$?
          cat /tmp/publish.log
          {
            echo "### Publish diagnostics ${{ matrix.rid }} (exit $status)"
            if grep -qE 'error|NU[0-9]{4}|NETSDK[0-9]{4}|MSB[0-9]{4}|IL[0-9]{4}' /tmp/publish.log; then
              grep -E 'error|NU[0-9]{4}|NETSDK[0-9]{4}|MSB[0-9]{4}|IL[0-9]{4}' /tmp/publish.log \
                | sed 's/^/    /' | sort -u | head -60
            else
              echo "    no error line matched; last 40 lines:"
              tail -40 /tmp/publish.log | sed 's/^/    /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qE 'error|NU[0-9]{4}|NETSDK[0-9]{4}|MSB[0-9]{4}' /tmp/publish.log; then
            grep -E 'error|NU[0-9]{4}|NETSDK[0-9]{4}|MSB[0-9]{4}' /tmp/publish.log | sort -u | head -40 | while IFS= read -r line; do
              printf '::error title=publish::%s\n' "${line//%/%25}"; done
          else
            tail -25 /tmp/publish.log | while IFS= read -r line; do
              printf '::error title=publish-tail::%s\n' "${line//%/%25}"; done
          fi
          exit "$status"

      - name: Remove PDB debug symbols
        shell: pwsh
        run: |
          $publishDirectory = "artifacts/desktop-${{ matrix.rid }}"
          $symbols = @(Get-ChildItem -LiteralPath $publishDirectory -Recurse -File -Filter '*.pdb')
          if ($symbols.Count -gt 0) { $symbols | Remove-Item -Force }
          $remaining = @(Get-ChildItem -LiteralPath $publishDirectory -Recurse -File -Filter '*.pdb')
          if ($remaining.Count -gt 0) { throw "PDB files remain in the Gallery artifact." }
          Write-Host "Excluded $($symbols.Count) PDB files from the Gallery artifact."

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gallery-desktop-${{ matrix.rid }}
          path: artifacts/desktop-${{ matrix.rid }}/

  build-android:
    name: Build Android Gallery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK & Android Workload
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify embedded official fonts
        shell: bash
        run: |
          mkdir -p src/Md3.Avalonia.Icons/Assets/Fonts
          python3 scripts/verify-fonts.py

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Build Android Gallery APK
        shell: bash
        run: |
          status=0
          dotnet publish gallery/Md3.Avalonia.Gallery.Android/Md3.Avalonia.Gallery.Android.csproj \
            -c Release \
            -f net10.0-android \
            -p:AndroidPackageFormat=apk \
            -o artifacts/android/ > /tmp/android.log 2>&1 || status=$?
          cat /tmp/android.log
          {
            echo "### Android publish diagnostics (exit $status)"
            if grep -qE 'error|NU[0-9]{4}|NETSDK[0-9]{4}|MSB[0-9]{4}|XA[0-9]{4}' /tmp/android.log; then
              grep -E 'error|NU[0-9]{4}|NETSDK[0-9]{4}|MSB[0-9]{4}|XA[0-9]{4}' /tmp/android.log \
                | sed 's/^/    /' | sort -u | head -60
            else
              echo "    no error line matched; last 40 lines:"
              tail -40 /tmp/android.log | sed 's/^/    /'
            fi
            echo "    installed workloads:"
            dotnet workload list 2>&1 | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qE 'error|NU[0-9]{4}|NETSDK[0-9]{4}|MSB[0-9]{4}' /tmp/android.log; then
            grep -E 'error|NU[0-9]{4}|NETSDK[0-9]{4}|MSB[0-9]{4}' /tmp/android.log | sort -u | head -40 | while IFS= read -r line; do
              printf '::error title=android::%s\n' "${line//%/%25}"; done
          else
            tail -25 /tmp/android.log | while IFS= read -r line; do
              printf '::error title=android-tail::%s\n' "${line//%/%25}"; done
          fi
          dotnet workload list 2>&1 | head -20 \
            | while IFS= read -r line; do printf '::notice title=workloads::%s\n' "${line//%/%25}"; done
          exit "$status"

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gallery-android
          path: artifacts/android/*.apk
          if-no-files-found: error
