<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Waterfall layout</title>
  <desc id="desc">Items are placed in order into the currently shortest column.</desc>
  <defs>
    <style>
      text { font-family: Inter, 'Segoe UI', Arial, 'Microsoft YaHei', sans-serif; fill: #251d2b; }
      .title { font-size: 26px; font-weight: 700; }
      .note { font-size: 15px; fill: #625a67; }
      .item { font-size: 20px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1000" height="360" rx="26" fill="#fbf8fc" />
  <text x="38" y="48" class="title">Waterfall layout</text>
  <text x="38" y="75" class="note">Each item goes to the currently shortest column.</text>

  <rect x="110" y="98" width="220" height="222" rx="18" fill="#f2ecf7" stroke="#d7cbdc" />
  <rect x="390" y="98" width="220" height="222" rx="18" fill="#e8f3ef" stroke="#c5d8ce" />
  <rect x="670" y="98" width="220" height="222" rx="18" fill="#fce8ef" stroke="#e6c9d2" />

  <rect x="132" y="118" width="176" height="70" rx="16" fill="#eaddff" />
  <text x="220" y="161" class="item">1</text>
  <rect x="132" y="198" width="176" height="92" rx="16" fill="#d9c7f4" />
  <text x="220" y="253" class="item">5</text>

  <rect x="412" y="118" width="176" height="108" rx="16" fill="#cce8dc" />
  <text x="500" y="180" class="item">2</text>
  <rect x="412" y="236" width="176" height="70" rx="16" fill="#b9d8cb" />
  <text x="500" y="279" class="item">6</text>

  <rect x="692" y="118" width="176" height="56" rx="16" fill="#f5cfe0" />
  <text x="780" y="153" class="item">3</text>
  <rect x="692" y="184" width="176" height="106" rx="16" fill="#edbfd2" />
  <text x="780" y="245" class="item">4</text>
</svg>
