name: CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generate or download fonts
        run: |
          mkdir -p src/Md3.Avalonia.Icons/Assets/Fonts
          python3 scripts/generate-fonts.py

      - name: Restore dependencies
        run: |
          dotnet restore gallery/Md3.Avalonia.Gallery.Desktop/Md3.Avalonia.Gallery.Desktop.csproj
          dotnet restore tests/Md3.Avalonia.HeadlessTests/Md3.Avalonia.HeadlessTests.csproj

      - name: Build Gallery and tests (Release)
        run: |
          dotnet build gallery/Md3.Avalonia.Gallery.Desktop/Md3.Avalonia.Gallery.Desktop.csproj -c Release --no-restore
          dotnet build tests/Md3.Avalonia.HeadlessTests/Md3.Avalonia.HeadlessTests.csproj -c Release --no-restore

      - name: Run Headless Tests
        run: |
          dotnet test tests/Md3.Avalonia.HeadlessTests/Md3.Avalonia.HeadlessTests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal" || true
          python3 scripts/report-test-results.py

      - name: Verify NuGet Packaging
        run: bash scripts/build-nuget.sh
