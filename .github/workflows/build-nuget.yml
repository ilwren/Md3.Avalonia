name: Build NuGet Packages

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  release:
    types: [published, created]
  workflow_dispatch:

jobs:
  pack:
    name: Build & Pack NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generate or download fonts
        run: |
          mkdir -p src/Md3.Avalonia.Icons/Assets/Fonts
          python3 scripts/generate-fonts.py

      - name: Build and Pack NuGet Packages
        run: |
          mkdir -p artifacts/nuget
          bash scripts/build-nuget.sh --output artifacts/nuget

      - name: Upload NuGet Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

      - name: Publish NuGet to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" artifacts/nuget/*.nupkg --clobber || true
          fi
