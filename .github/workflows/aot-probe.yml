name: AOT probe

on:
  workflow_dispatch:
  push:
    # The probe is the only place the desktop gallery is actually compiled to native code, so it
    # follows everything that can break that: the gallery, the library it consumes, the package
    # manifests, and the script that does the publish.
    branches: [main, 'arena/**']
    paths:
      - '.github/workflows/aot-probe.yml'
      - 'gallery/**'
      - 'src/**'
      - 'scripts/publish-gallery-aot.sh'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'

jobs:
  publish-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the native toolchain ILC links against
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # A display stack, so the publish can be smoke-run: the script runs the produced binary
      # under xvfb when xvfb-run is available. ILC compiling the app proves nothing about the
      # reflection that is missing at run time, which is how native AOT actually fails.
      - name: Install the display stack for the smoke run
        run: sudo apt-get install -y xvfb libx11-6 libice6 libsm6 libfontconfig1

      # publish-gallery-aot.sh is the same entry point a developer runs locally: it publishes
      # with PublishAot=true, asserts the output is a native executable with no managed assembly
      # beside it, fails on any ILxxxx diagnostic (the README claims zero), and starts the binary
      # to see whether it survives. TreatWarningsAsErrors stays off inside the script until that
      # count is zero: one run then reports both the diagnostics and whether the produced binary
      # still starts, and a build that dies at the first analyzer warning would hide the second
      # answer. That flag is the last thing to remove, not the first.
      - name: Publish, verify and smoke-run the desktop gallery
        run: |
          scripts/publish-gallery-aot.sh --rid linux-x64 --output /tmp/aot-out

      - name: Upload the native binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-native-${{ github.sha }}
          path: |
            /tmp/aot-out
            artifacts/aot/*.log
          if-no-files-found: ignore
