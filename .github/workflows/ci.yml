name: CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Download Material Symbols Rounded Font
        run: |
          mkdir -p src/Md3.Avalonia.Icons/Assets/Fonts
          FONT_URL="https://github.com/google/material-design-icons/raw/master/variablefont/MaterialSymbolsRounded%5BFILL%2CGRAD%2Copsz%2Cwght%5D.ttf"
          curl -sSL "$FONT_URL" -o src/Md3.Avalonia.Icons/Assets/Fonts/MaterialSymbolsRounded.ttf
          ls -lh src/Md3.Avalonia.Icons/Assets/Fonts/MaterialSymbolsRounded.ttf

      - name: Restore dependencies
        run: dotnet restore Md3.Avalonia.sln

      - name: Build solution (Release)
        run: dotnet build Md3.Avalonia.sln -c Release --no-restore

      - name: Run Headless Tests
        id: test_step
        run: |
          set +e
          dotnet test tests/Md3.Avalonia.HeadlessTests/Md3.Avalonia.HeadlessTests.csproj -c Release --no-build --logger "console;verbosity=detailed" --logger "trx;LogFileName=test_results.trx" > test_output.log 2>&1
          TEST_EXIT_CODE=$?
          echo "## Test Execution Log" >> $GITHUB_STEP_SUMMARY
          echo "Exit code: $TEST_EXIT_CODE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 test_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $TEST_EXIT_CODE -ne 0 ]; then
            echo "### Failures / Errors" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E -C 3 "(Failed|Error|Exception|Assert)" test_output.log | head -n 120 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $TEST_EXIT_CODE
          fi

      - name: Verify NuGet Packaging
        run: bash scripts/build-nuget.sh --font src/Md3.Avalonia.Icons/Assets/Fonts/MaterialSymbolsRounded.ttf
