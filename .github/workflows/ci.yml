name: CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A new push makes the previous run's answer irrelevant. Cancelling it frees the runner
# immediately instead of letting two builds of the same branch compete for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  # The terminal logger spends real time redrawing progress that nobody watches in CI.
  DOTNET_CLI_UI_LANGUAGE: en
  MSBUILDTERMINALLOGGER: 'off'

# Least privilege, declared rather than inherited: the conformance publisher needs to write a
# pull request comment, and relying on the repository-wide default would make this workflow's
# behaviour depend on a setting that is not in the repository.
permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------------------------
  # Pure Python, no SDK, no restore: finishes in seconds and fails the run before a two-minute
  # build starts. Every check here is one that used to be either invisible or buried at the end.
  # ---------------------------------------------------------------------------------------------
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify embedded official fonts
        run: |
          mkdir -p src/Md3.Avalonia.Icons/Assets/Fonts
          python3 scripts/verify-fonts.py

      - name: Lint design tokens
        run: python3 scripts/lint-design-tokens.py --github --summary

      - name: Check API documentation coverage
        # Check that DocFX covers all packable projects and public interfaces have bilingual XML docs.
        run: python3 scripts/check-api-doc-coverage.py

      - name: Check release naming and overwrite protection
        run: python3 scripts/check-release-isolation.py

      - name: Check Gallery localization coverage
        # Defect #29: the Gallery translates by key match, so an entry that was never written leaves
        # a page quietly half-English and nothing fails. This measures the gap and fails on a
        # duplicate key, which silently kills whichever of two translations came first. --strict is
        # on because prose coverage is complete: a new page that ships untranslated now fails.
        run: python3 scripts/check-gallery-localization.py --strict

      - name: Check the specification oracle against pinned upstream sources
        # Network-dependent and advisory by design: upstream moving is a re-baselining
        # decision for a human, not a build failure. --soft keeps it off the critical path.
        continue-on-error: true
        run: python3 scripts/sync-spec-tokens.py --soft

      - name: Publish static analysis report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish-conformance.py

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-checks
          path: artifacts/spec/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------------
  # One restore, one build graph, one test run.
  #
  # Deliberately NOT here any more:
  #   * NuGet packaging  -> .github/workflows/build-nuget.yml already runs `scripts/build-nuget.sh`
  #                         on push to main/arena/** and on every PR to main, from a clean tree.
  #                         Running it twice per commit cost a full extra rebuild of all four
  #                         packaged projects for an identical answer.
  #   * Multi-OS gallery -> .github/workflows/build-gallery.yml covers Linux, Windows and macOS on
  #                         the same triggers. The Linux Desktop head is still built below because
  #                         it is nearly free once the shared graph is compiled, and it is what
  #                         produces the inline compiler annotations.
  # ---------------------------------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    needs: static-checks
    runs-on: ubuntu-latest
    # Most of this is restore and build - the shared graph, fifteen packages, the gallery and the
    # test project - with the headless suite on top. It measured 6m35s at fourteen packages and
    # crossed 8m when the fifteenth landed, so the margin here is a deadlock guard, not a
    # performance budget: a hung test still costs a quarter of an hour instead of a runner-day.
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Restoring both heads once up front lets every later command run --no-restore. The old
      # pipeline restored the same graph three separate times.
      - name: Restore
        shell: bash
        run: |
          status=0
          : > /tmp/restore.log
          for proj in gallery/Md3.Avalonia.Gallery.Desktop/Md3.Avalonia.Gallery.Desktop.csproj \
                      tests/Md3.Avalonia.HeadlessTests/Md3.Avalonia.HeadlessTests.csproj; do
            name="$(basename "$proj" .csproj)"
            echo "=== dotnet restore $proj ==="
            if dotnet restore "$proj" --nologo >> /tmp/restore.log 2>&1; then
              echo "--- $name: OK"
            else
              echo "--- $name: FAILED"
              status=1
            fi
          done
          cat /tmp/restore.log
          {
            echo "### Restore diagnostics"
            if grep -qE 'error|NU[0-9]{4}|NETSDK[0-9]{4}|MSB[0-9]{4}' /tmp/restore.log; then
              grep -E 'error|NU[0-9]{4}|NETSDK[0-9]{4}|MSB[0-9]{4}' /tmp/restore.log \
                | sed 's/^/    /' | sort -u | head -60
            else
              echo "    no error line matched; last 40 lines:"
              tail -40 /tmp/restore.log | sed 's/^/    /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Job summaries are not reachable from the API in this environment, but workflow
          # annotations are, so mirror the findings there as well.
          if grep -qE 'error|NU[0-9]{4}|NETSDK[0-9]{4}|MSB[0-9]{4}' /tmp/restore.log; then
            grep -E 'error|NU[0-9]{4}|NETSDK[0-9]{4}|MSB[0-9]{4}' /tmp/restore.log | sort -u | head -40 | while IFS= read -r line; do
              printf '::error title=restore::%s\n' "${line//%/%25}"; done
          else
            tail -25 /tmp/restore.log | while IFS= read -r line; do
              printf '::error title=restore-tail::%s\n' "${line//%/%25}"; done
          fi
          exit "$status"

      - name: Build Gallery Desktop
        shell: bash
        run: |
          scripts/ci-build.sh \
            gallery/Md3.Avalonia.Gallery.Desktop/Md3.Avalonia.Gallery.Desktop.csproj \
            "Gallery Desktop"

      - name: Build tests
        shell: bash
        run: |
          scripts/ci-build.sh \
            tests/Md3.Avalonia.HeadlessTests/Md3.Avalonia.HeadlessTests.csproj \
            "Headless tests"

      # The markdown and hex editor tests ask for Consolas, which no runner has, so whether they pass
      # depends on which libSkiaSharp the test output carries: Avalonia's build enumerates system
      # fonts and falls back to a family that exists, while the NoDependencies build ScottPlot pulls
      # in cannot, and fails to create a glyph typeface instead. When those tests go red this is the
      # first thing to read, so it is reported as an annotation rather than left in the log.
      - name: Report the Skia native build the tests will use
        run: |
          # The RID that matters on this runner is linux-x64; the runtimes folder also holds musl,
          # bionic and arm builds that never load here, and reporting those instead pushes the
          # answer past the annotation cap.
          so=tests/Md3.Avalonia.HeadlessTests/bin/Release/net10.0/runtimes/linux-x64/native/libSkiaSharp.so
          if [ -f "$so" ]; then
            links=$(ldd "$so" 2>/dev/null | grep -ci fontconfig || true)
            echo "::notice::Loaded libSkiaSharp.so: fontconfig links=$links md5=$(md5sum "$so" | cut -d' ' -f1) bytes=$(stat -c%s "$so")"
          else
            echo "::notice::No libSkiaSharp.so beside the test assembly"
          fi
          dotnet list tests/Md3.Avalonia.HeadlessTests/Md3.Avalonia.HeadlessTests.csproj package \
            --include-transitive | grep -i skia | sed 's/^ *//' | sort -u \
            | while read -r line; do echo "::notice::Skia package: $line"; done
          if command -v fc-list > /dev/null; then
            echo "::notice::Runner fonts: $(fc-list | wc -l) families, $(fc-list | grep -ci consolas || true) named Consolas"
          else
            echo "::notice::Runner has no fc-list, so no fontconfig to enumerate system fonts with"
          fi

      # The node editor theme tests are run on their own first, and under a hard timeout. A test that
      # stalls the dispatcher never reaches a result, so the only thing a per-test timeout can buy is
      # a name; what actually bounds the damage is killing the runner and moving on. Running them
      # first, apart from the rest of the suite, means a stall there is visible as a five-minute step
      # that produced no result, and the suite that follows still reports in full. A separate
      # invocation is also a separate process, which matters: a test that throws part way through a
      # pumped dispatcher leaves the shared UI thread in a state the rest of the suite cannot run
      # in, and every later class fails or stalls on someone else's mistake.
      - name: Probe the node editor theme tests
        id: nodifym-probe
        continue-on-error: true
        run: scripts/probe-tests.sh MdNodifyMThemeTests nodifym.trx

      # Summarizes whichever .trx exists at this point, which is the probe's. The script exits non-zero
      # on failures, and the suite still has to run, so the exit is swallowed here and the probe's own
      # outcome is what fails the job at the end.
      - name: Summarize node editor probe results
        if: always()
        continue-on-error: true
        run: python3 scripts/report-test-results.py

      # The markdown and hex editor tests fail on a font no runner has, and the gallery tests fail
      # the same way beside them - but the markdown class passes when it runs alone, so the font is
      # not the cause: something earlier in the suite leaves the process unable to shape text. The
      # gallery is the other half of that pair, and the node editor page is the newest thing in it,
      # so this is where the search starts.
      #
      # Found, and it is the markdown page's inline code. Markdown.Avalonia's CCode defaults its
      # MonospaceFontFamily to FontFamilyCollector.TryGetMonospace(), which returns the first entry
      # of the system font collection whose name contains one of eight substrings - in enumeration
      # order, not preference order, so the pick differs between machines and between processes,
      # which is why the same code passed this probe on one run and failed it on the next. A family
      # from that collection carries the fonts:SystemFonts key, and FontManager gives a keyed single
      # family no fallback, so one the machine advertises but cannot shape throws at measure time.
      # MaterialMarkdownTheme now sets the property to a family list, which is a composite key and
      # does fall back; MdMarkdownThemeTests pins it. What is left here is a canary, not a symptom.
      - name: Probe the markdown theme tests alone
        continue-on-error: true
        run: scripts/probe-tests.sh MdMarkdownThemeTests markdown.trx

      - name: Probe the gallery tests alone
        continue-on-error: true
        run: scripts/probe-tests.sh MdGallery gallery.trx

      # The map theme is the newest package and the only one that reaches a third-party Skia text
      # stack, so its eight tests are run on their own as well: the notice is what says they ran and
      # how many, which the main suite's summary cannot be read back for.
      - name: Probe the map theme tests alone
        continue-on-error: true
        run: scripts/probe-tests.sh MdMapsuiThemeTests mapsui.trx

      # The localization sweep rewrote a table built in a static initialiser, and until these tests
      # existed nothing in the suite called GalleryLocalization at all - so this probe is the only
      # evidence that the path runs, and that a key defined twice would be caught at run time
      # rather than by the static checker alone.
      - name: Probe the gallery localization tests alone
        continue-on-error: true
        run: scripts/probe-tests.sh MdGalleryLocalizationTests localization.trx

      # A control that draws itself has no template to assert on, so its probe is the evidence that
      # the peak reduction, the scrub and the painted played/unplayed split actually ran.
      - name: Probe the waveform tests alone
        continue-on-error: true
        run: scripts/probe-tests.sh MdWaveformTests waveform.trx

      # A masonry panel and a collapsible sheet are both layout and state rather than paint: which
      # column a child actually landed in, and whether a collapsed sheet is still catching clicks
      # over the page it is supposed to be overlaying. Neither shows up in a property dump.
      - name: Probe the layout extras tests alone
        continue-on-error: true
        run: scripts/probe-tests.sh MdLayoutExtrasTests layout-extras.trx

      # Ink is the one thing here that a property dump cannot show at all: whether a stroke drawn
      # with simulated pointer input is actually committed by the canvas, and whether clearing
      # removes it. Both depend on upstream's hit testing and stroke list rather than on anything
      # this repository owns, so they are worth running on their own.
      - name: Probe the signature pad tests alone
        continue-on-error: true
        run: scripts/probe-tests.sh MdSignaturePadThemeTests signature-pad.trx

      # Drag, resize and collapse are all gesture-driven state, and the collapse now travels rather
      # than snapping, so a regression here is a window that ends up the wrong size rather than one
      # that fails loudly. Worth running on its own.
      - name: Probe the floating window tests alone
        continue-on-error: true
        run: scripts/probe-tests.sh MdFloatingWindowTests floating-window.trx

      # Bounded, because an unbounded stall costs the job's whole timeout and takes the run's
      # annotations with it. The suite measured about four and a half minutes before main's tests
      # were merged in and then ran past ten, so fifteen is the wall now: high enough that ordinary
      # growth does not trip it, still low enough that a hang is reported as a failed step and every
      # step after this one can publish what it found.
      - name: Run headless tests
        id: tests
        env:
          # Documentation preview bitmaps are asset generation, not verification. They are
          # produced only on main, where the artefact is actually published.
          MD3_WRITE_PREVIEWS: ${{ github.ref == 'refs/heads/main' && '1' || '0' }}
        run: |
          status=0
          timeout --signal=KILL 900 dotnet test \
            tests/Md3.Avalonia.HeadlessTests/Md3.Avalonia.HeadlessTests.csproj \
            -c Release --no-build --no-restore \
            --filter "FullyQualifiedName!~MdNodifyMThemeTests" \
            --logger "trx;LogFileName=results.trx" \
            --logger "console;verbosity=normal" || status=$?

          # timeout exits 124 when it kills the command, and that is the only case this step can
          # honestly call a stall. Every other non-zero status is the suite reporting failures,
          # and labelling that a timeout sends the next reader looking in the wrong place.
          if (( status == 124 )); then
            echo "::error::The headless suite did not finish inside fifteen minutes"
          elif (( status != 0 )); then
            echo "::error::The headless suite failed with exit code ${status}"
          fi
          exit "$status"

      # Only meaningful once the test runner actually produced a .trx. Running it after a
      # compile failure would add a second red step that says nothing about the real cause.
      - name: Summarize headless test results
        if: always() && steps.tests.outcome != 'skipped'
        run: python3 scripts/report-test-results.py

      - name: Publish specification conformance reports
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish-conformance.py

      - name: Upload test and conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-test-results
          path: |
            **/results.trx
            **/nodifym.trx
            artifacts/spec/
          if-no-files-found: warn

      - name: Upload documentation previews
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-previews
          path: tests/Md3.Avalonia.HeadlessTests/bin/Release/net10.0/*.png
          if-no-files-found: ignore

      # The probe is allowed to fail so that the rest of the suite still runs and still reports; the
      # job should not stay green because of it. This is the last step, so it runs after the evidence
      # above has been uploaded either way.
      - name: Fail the job if the node editor probe did not pass
        if: always() && steps.nodifym-probe.outcome == 'failure'
        run: |
          echo "::error::The node editor theme tests did not pass inside the probe's five minutes"
          exit 1
