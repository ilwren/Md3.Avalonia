name: Build Multi-Platform Gallery

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop Gallery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Desktop Gallery (${{ matrix.rid }})
        run: |
          dotnet publish gallery/Md3.Avalonia.Gallery.Desktop/Md3.Avalonia.Gallery.Desktop.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained false \
            -o artifacts/desktop-${{ matrix.rid }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gallery-desktop-${{ matrix.rid }}
          path: artifacts/desktop-${{ matrix.rid }}/

  build-android:
    name: Build Android Gallery
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK & Android Workload
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Android Workload
        run: |
          dotnet workload install android || true

      - name: Build Android Gallery APK
        run: |
          dotnet build gallery/Md3.Avalonia.Gallery.Android/Md3.Avalonia.Gallery.Android.csproj \
            -c Release \
            -o artifacts/android/ || true

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gallery-android
          path: artifacts/android/
          if-no-files-found: warn
