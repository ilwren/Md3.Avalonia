name: AOT probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - '.github/workflows/aot-probe.yml'
      - 'scripts/publish-gallery-aot.sh'
      - 'src/**'
      - 'gallery/**'

jobs:
  publish-aot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install the native toolchain ILC links against
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev xvfb libx11-6 libice6 libsm6 libfontconfig1
      # The script is the single source of truth for the AOT publish: it asserts the output is a
      # native executable with no managed app assembly beside it, then smoke-runs it under xvfb.
      - name: Publish, verify and smoke the native AOT gallery
        run: |
          bash scripts/publish-gallery-aot.sh --rid linux-x64 --output /tmp/aot-out --smoke 2>&1 | tee /tmp/aot.log
          {
            echo "### AOT publish output"
            ls -la /tmp/aot-out | head -20 | sed 's/^/    /'
          } >> $GITHUB_STEP_SUMMARY
      - name: Count trim and AOT diagnostics
        if: always()
        run: |
          echo "### Diagnostics" >> $GITHUB_STEP_SUMMARY
          if grep -qoE 'IL[0-9]{4}' /tmp/aot.log; then
            grep -oE 'IL[0-9]{4}' /tmp/aot.log | sort | uniq -c | sort -rn | sed 's/^/    /' >> $GITHUB_STEP_SUMMARY
            echo "DIAGNOSTICS FOUND:"; grep -oE 'IL[0-9]{4}' /tmp/aot.log | sort | uniq -c | sort -rn
          else
            echo "    none" >> $GITHUB_STEP_SUMMARY
          fi
