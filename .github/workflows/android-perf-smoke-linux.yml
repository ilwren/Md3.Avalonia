# TEMPORARY verification workflow for scripts/collect-android-perf.py. Same idea as the
# (already removed) macOS smoke: install, launch, collect, upload — but on ubuntu-latest,
# because macOS runner capacity is degraded and no emulator step of any branch can currently
# finish there. The Android side (API 34, x86_64, Pixel 6, swiftshader) is identical, which is
# what the collector's parsing is verified against. DELETE AFTER IT GOES GREEN.
name: Android Perf Collector Smoke Linux (TEMPORARY)

on:
  pull_request:
    paths:
      - '.github/workflows/android-perf-smoke-linux.yml'

jobs:
  collector-smoke-linux:
    name: Collector smoke on Linux emulator
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET SDK & Workloads
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Build Android Gallery APK
        run: |
          dotnet publish gallery/Md3.Avalonia.Gallery.Android/Md3.Avalonia.Gallery.Android.csproj \
            -c Release \
            -f net10.0-android \
            -p:AndroidPackageFormat=apk \
            -o artifacts/android/

      - name: Install, launch and collect
        timeout-minutes: 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            mkdir -p artifacts/android-test
            LOG=artifacts/android-test/run.log
            run() { echo "+++ $*" >> "$LOG"; "$@" >> "$LOG" 2>&1 || echo "!!! FAILED ($?): $*" >> "$LOG"; }
            run adb devices
            run adb install artifacts/android/*.apk
            run adb shell monkey -p io.arena.md3avalonia.gallery -c android.intent.category.LAUNCHER 1
            sleep 20
            run python3 scripts/collect-android-perf.py \
              --package io.arena.md3avalonia.gallery \
              --apk artifacts/android \
              --output-dir artifacts/android-test \
              --summary --github
            echo "===== run.log ====="
            cat "$LOG" || true
            echo "===== evidence tree ====="
            ls -la artifacts/android-test/ || true
            python3 -c "import json; d = json.load(open('artifacts/android-test/android-perf.json')); print('smoke ok: package =', d['package'], '| warnings =', d['warnings'])" \
              || echo "!!! android-perf.json missing or invalid"

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-perf-smoke-linux
          path: artifacts/android-test/
          if-no-files-found: warn
