name: Publish Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release channel
        type: choice
        required: true
        default: preview
        options:
          - preview
          - stable
      version:
        description: Base semantic version, without a preview suffix (for example 0.5.6)
        type: string
        required: true
        default: '0.5.6'
      preview_number:
        description: Preview sequence; used only for preview releases (for example 1)
        type: string
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      release_type: ${{ steps.resolve.outputs.release_type }}
      android_version_code: ${{ steps.resolve.outputs.android_version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and validate version
        id: resolve
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          BASE_VERSION: ${{ inputs.version }}
          PREVIEW_NUMBER: ${{ inputs.preview_number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from the main branch." >&2
            exit 1
          fi
          if [[ ! "$BASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be a stable base such as 0.5.6 (do not include a prerelease suffix)." >&2
            exit 1
          fi

          case "$RELEASE_TYPE" in
            preview)
              if [[ ! "$PREVIEW_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
                echo "Preview number must be a positive integer." >&2
                exit 1
              fi
              VERSION="${BASE_VERSION}-preview.${PREVIEW_NUMBER}"
              ;;
            stable)
              VERSION="$BASE_VERSION"
              ;;
            *)
              echo "Unknown release channel: $RELEASE_TYPE" >&2
              exit 1
              ;;
          esac

          TAG="v${VERSION}"
          remote_tag="$(git ls-remote --tags origin "refs/tags/${TAG}")"
          if [[ -n "$remote_tag" ]]; then
            echo "Tag ${TAG} already exists; choose a new version." >&2
            exit 1
          fi

          # The Android version code must increase for each workflow run; the repository's
          # checked-in code advances from 6 to 12 with the six-control version increment.
          ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 12))
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_type=${RELEASE_TYPE}" >> "$GITHUB_OUTPUT"
          echo "android_version_code=${ANDROID_VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${RELEASE_TYPE} version ${VERSION} (${TAG})."

  test:
    name: Headless tests
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run headless tests
        run: |
          dotnet test tests/Md3.Avalonia.HeadlessTests/Md3.Avalonia.HeadlessTests.csproj \
            -c Release \
            --logger "console;verbosity=normal"

  pack-nuget:
    name: Pack the NuGet packages
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Pack with release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/build-nuget.sh --output artifacts/nuget --version "$RELEASE_VERSION"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: release-nuget
          path: artifacts/nuget/*
          if-no-files-found: error
          retention-days: 7

  gallery-desktop:
    name: Publish desktop Gallery (${{ matrix.rid }})
    needs: [prepare, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify embedded official fonts
        shell: bash
        run: |
          mkdir -p src/Md3.Avalonia.Icons/Assets/Fonts
          python3 scripts/verify-fonts.py || python scripts/verify-fonts.py

      # Keep release Gallery builds self-contained/JIT for now: the recorded AOT evidence is a
      # historical Linux x64 probe with Binding(String) trim/dynamic-code warnings in the DataGrid
      # page. Revalidate current source and all release RIDs before shipping NativeAOT artifacts.
      - name: Publish self-contained desktop Gallery
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          dotnet publish gallery/Md3.Avalonia.Gallery.Desktop/Md3.Avalonia.Gallery.Desktop.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:Version="$RELEASE_VERSION" \
            -p:DebugSymbols=false \
            -p:DebugType=None \
            -o "artifacts/desktop-${{ matrix.rid }}"

      - name: Remove debug symbols from Gallery package
        shell: pwsh
        run: |
          $publishDirectory = "artifacts/desktop-${{ matrix.rid }}"
          $symbols = @(Get-ChildItem -LiteralPath $publishDirectory -Recurse -File -Filter '*.pdb')
          if ($symbols.Count -gt 0) { $symbols | Remove-Item -Force }
          $remaining = @(Get-ChildItem -LiteralPath $publishDirectory -Recurse -File -Filter '*.pdb')
          if ($remaining.Count -gt 0) { throw "PDB files remain in the release Gallery output." }
          Write-Host "Excluded $($symbols.Count) PDB files from the release Gallery."

      - name: Archive Unix desktop Gallery
        if: matrix.rid != 'win-x64'
        shell: bash
        run: |
          (cd "artifacts/desktop-${{ matrix.rid }}" && \
            zip -qr "$GITHUB_WORKSPACE/artifacts/gallery-${{ matrix.rid }}.zip" .)

      - name: Archive Windows desktop Gallery
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "artifacts/desktop-win-x64/*" `
            -DestinationPath "artifacts/gallery-win-x64.zip" `
            -Force

      - name: Upload desktop Gallery archive
        uses: actions/upload-artifact@v4
        with:
          name: gallery-desktop-${{ matrix.rid }}
          path: artifacts/gallery-${{ matrix.rid }}.zip
          if-no-files-found: error
          retention-days: 7

  gallery-android:
    name: Publish Android Gallery
    needs: [prepare, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Verify embedded official fonts
        run: |
          mkdir -p src/Md3.Avalonia.Icons/Assets/Fonts
          python3 scripts/verify-fonts.py

      - name: Publish versioned Gallery APK
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.android_version_code }}
        run: |
          dotnet publish gallery/Md3.Avalonia.Gallery.Android/Md3.Avalonia.Gallery.Android.csproj \
            -c Release \
            -f net10.0-android \
            -p:Version="$RELEASE_VERSION" \
            -p:ApplicationDisplayVersion="$RELEASE_VERSION" \
            -p:ApplicationVersion="$ANDROID_VERSION_CODE" \
            -p:AndroidPackageFormat=apk \
            -o artifacts/android

      - name: Upload Android Gallery
        uses: actions/upload-artifact@v4
        with:
          name: gallery-android
          path: artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: [prepare, test, pack-nuget, gallery-desktop, gallery-android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Package Gallery assets and checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-bundle
          for rid in linux-x64 win-x64 osx-x64; do
            archive="release-artifacts/gallery-desktop-${rid}/gallery-${rid}.zip"
            test -f "$archive"
            cp "$archive" release-bundle/
          done
          find release-artifacts/gallery-android -maxdepth 1 -type f -name '*.apk' -exec cp {} release-bundle/ \;
          test -n "$(find release-bundle -maxdepth 1 -type f -name '*.apk' -print -quit)"
          cp release-artifacts/release-nuget/* release-bundle/
          (cd release-bundle && sha256sum * > SHA256SUMS.txt)
          echo "Prepared release bundle for ${RELEASE_VERSION}:"
          ls -lh release-bundle

      # The Release is created before anything talks to nuget.org, so a Trusted Publishing
      # failure cannot leave a built release with nowhere to go. Every .nupkg and .snupkg is
      # attached here, which makes a manual push possible without re-running any build.
      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_TYPE: ${{ needs.prepare.outputs.release_type }}
        run: |
          set -euo pipefail
          # Re-run safe: a second run of this job must not fail on a tag that already exists,
          # otherwise recovering from a later failure would need a manual release delete.
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; uploading assets into it."
            gh release upload "$RELEASE_TAG" release-bundle/* --clobber
          else
            release_args=(
              "$RELEASE_TAG"
              --title "Md3.Avalonia ${RELEASE_VERSION}"
              --target "$GITHUB_SHA"
              --generate-notes
            )
            if [[ "$RELEASE_TYPE" == "preview" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}" release-bundle/*
          fi

  # Deliberately a separate job. If the push fails, the Release above already exists with the
  # packages attached, and "Re-run failed jobs" retries only this job - the Release job is not
  # dragged along and cannot collide with the tag it already created.
  push-nuget:
    name: Push packages to nuget.org
    needs: [prepare, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Trusted publishing: this job exchanges the Actions OIDC token for a short-lived nuget.org
      # API key, so no long-lived key is stored in the repository. Only this job gets the
      # permission; the build, test and Release jobs never talk to nuget.org.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: release-nuget
          path: release-artifacts/release-nuget

      - name: Publish packages to NuGet.org
        env:
          # The nuget.org account that owns the packages. A repository variable rather than a
          # secret, because the name is not sensitive: the Trusted Publishing policy is what
          # actually authorises the push.
          NUGET_USERNAME: ${{ vars.NUGET_USERNAME }}
        run: |
          set -euo pipefail

          # Take the expected count from the one list that already drives the pack step, so adding
          # a package cannot leave this check behind the way a hardcoded "exactly seven" did.
          expected="$(sed -n 's/^PACKAGE_IDS=(\(.*\))$/\1/p' scripts/build-nuget.sh | wc -w)"
          if (( expected == 0 )); then
            echo "Could not read PACKAGE_IDS out of scripts/build-nuget.sh." >&2
            exit 1
          fi

          shopt -s nullglob
          packages=(release-artifacts/release-nuget/*.nupkg)
          if (( ${#packages[@]} != expected )); then
            echo "Expected ${expected} .nupkg files, found ${#packages[@]}." >&2
            exit 1
          fi

          if [[ -z "${NUGET_USERNAME:-}" ]]; then
            echo "Repository variable NUGET_USERNAME must name the nuget.org account that owns the packages." >&2
            exit 1
          fi

          # Trusted publishing: the Actions OIDC token is exchanged for an API key that nuget.org
          # expires after about an hour. That is why the exchange happens here and not at the top
          # of the job - the test, pack and Gallery builds before this step can outlast the key.
          #
          # The audience has to be the full origin "https://www.nuget.org", percent-encoded
          # because curl passes the query string through untouched. nuget.org rejects any other
          # value with "The JSON web token has an incorrect audience." It then matches the
          # token's repository, repository_owner, job_workflow_ref and environment claims against
          # the Trusted Publishing policy. The token endpoint also requires a User-Agent header.
          if ! oidc_response="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fwww.nuget.org")"; then
            echo "GitHub refused the OIDC token request. This job needs the id-token: write permission." >&2
            exit 1
          fi
          if ! oidc_token="$(printf '%s' "${oidc_response}" | jq -er '.value' 2>/dev/null)"; then
            echo "The Actions OIDC response carried no token." >&2
            exit 1
          fi
          # Masked before it can reach a log line, the way the NuGet/login action does.
          printf '::add-mask::%s\n' "${oidc_token}"

          token_response="$(curl -sS -X POST 'https://www.nuget.org/api/v2/token' \
            -H "Authorization: Bearer ${oidc_token}" \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: md3-avalonia-publish-release' \
            --data "{\"username\":\"${NUGET_USERNAME}\",\"tokenType\":\"ApiKey\"}")"
          if ! api_key="$(printf '%s' "${token_response}" | jq -er '.apiKey' 2>/dev/null)"; then
            echo "nuget.org did not return an API key. Check the Trusted Publishing policy: it has to name this repository owner, this repository, this workflow file, and an environment that matches this job." >&2
            printf '%s\n' "${token_response}" >&2
            exit 1
          fi
          # Masked before the key can reach a log line.
          printf '::add-mask::%s\n' "${api_key}"

          # One key covers every package the policy's glob allows, so all packages go up with the
          # same short-lived key. Each .nupkg carries the .snupkg sitting beside it.
          failed=0
          for package in "${packages[@]}"; do
            dotnet nuget push "${package}" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${api_key}" \
              --skip-duplicate || failed=$((failed + 1))
          done
          if (( failed > 0 )); then
            echo "${failed} of ${#packages[@]} packages failed to push." >&2
            exit 1
          fi
          echo "Pushed ${#packages[@]} packages to nuget.org."

      # The Release job already attached every .nupkg, so a failure here costs a re-run of this
      # job only. Say where the packages are instead of leaving the reader to work it out.
      - name: Report the fallback
        if: failure()
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          {
            echo "### nuget.org push failed"
            echo ""
            echo "The GitHub Release \`${RELEASE_TAG}\` was still created, and every \`.nupkg\` and"
            echo "\`.snupkg\` is attached to it. Download them and push by hand:"
            echo ""
            echo '```bash'
            echo "dotnet nuget push '*.nupkg' --source https://api.nuget.org/v3/index.json --api-key <your-key>"
            echo '```'
            echo ""
            echo "Or re-run only this job once the cause is fixed - \`--skip-duplicate\` skips the"
            echo "versions that already landed."
          } >> "$GITHUB_STEP_SUMMARY"