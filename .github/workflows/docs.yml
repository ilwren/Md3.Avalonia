name: API documentation

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build API docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK and DocFX runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install pinned DocFX version
        run: |
          dotnet tool install --global docfx --version 2.81.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate API metadata
        run: docfx metadata docfx.json

      - name: Build documentation site
        run: docfx build docfx.json

      - name: Prepare static Pages output
        # upload-pages-artifact archives dotfiles, so the marker is included without extra inputs.
        run: touch _site/.nojekyll

      # This repository has one shared Pages URL: the Arena branch is a temporary preview,
      # and a deployment from main will replace it with the production version.
      - name: Upload GitHub Pages artifact
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/7fa0e0b4-md3-avalonia' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy GitHub Pages
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/7fa0e0b4-md3-avalonia' }}
    needs: build
    # Preview and production share one Pages URL; serialize deployments without cancelling an active publish.
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
